<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雑学クイズ</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'メイリオ', 'Yu Gothic', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
    }

    .top-line {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #e94560, #9b59b6, #f5a623);
      flex-shrink: 0;
    }

    .container {
      max-width: 640px;
      width: 90%;
      padding: 2.5rem 0 2rem;
      flex: 1;
    }

    /* ── ヘッダー */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2rem;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      background: linear-gradient(90deg, #e94560, #f5a623);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem;
    }

    .header p {
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      color: #8899aa;
    }

    /* ── プログレスバー */
    .progress-section { margin-bottom: 1.4rem; }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: #8899aa;
      margin-bottom: 0.5rem;
    }

    .progress-bar {
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #f5a623);
      border-radius: 3px;
      transition: width 0.45s ease;
    }

    /* ── スコア表示 */
    .score-display {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.4rem;
    }

    .score-card {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      padding: 0.85rem 0.5rem;
      text-align: center;
    }

    .score-card .label {
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      color: #8899aa;
      margin-bottom: 0.3rem;
      display: block;
    }

    .score-card .value { font-size: 1.6rem; font-weight: bold; }
    .score-card.accuracy .value {
      background: linear-gradient(90deg, #e94560, #f5a623);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .score-card.correct .value { color: #4ade80; }
    .score-card.wrong   .value { color: #f87171; }

    /* ── 問題カード */
    .question-card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      padding: 1.8rem 2rem 1.6rem;
      margin-bottom: 1rem;
      position: relative;
    }

    /* バッジ行 */
    .badge-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
    }

    .badge {
      padding: 3px 10px;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      border: 1px solid;
      border-radius: 2px;
    }

    .badge-num { border-color: rgba(233,69,96,0.5);   color: #e94560; }
    .badge-cat { border-color: rgba(245,166,35,0.45); color: #f5a623; }

    /* 問題テキスト */
    .quote-box {
      border-left: 2px solid #e94560;
      padding: 0.9rem 1rem 0.9rem 1.2rem;
      background: linear-gradient(to right, rgba(233,69,96,0.06), transparent);
      margin-bottom: 1.6rem;
      min-height: 60px;
      display: flex;
      align-items: center;
    }

    .question-text {
      font-size: 1.12rem;
      line-height: 1.85;
      letter-spacing: 0.03em;
    }

    /* 正誤フィードバックオーバーレイ */
    .feedback-overlay {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .feedback-overlay.show { opacity: 1; }
    .feedback-overlay.correct { background: rgba(74,222,128,0.18);  border: 2px solid #4ade80; border-radius: 20px; }
    .feedback-overlay.wrong   { background: rgba(248,113,113,0.15); border: 2px solid #f87171; border-radius: 20px; }

    .feedback-icon  { font-size: 2.8rem; margin-bottom: 0.3rem; }
    .feedback-text  { font-size: 1.1rem; font-weight: bold; }
    .feedback-truth {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.65);
      margin-top: 0.3rem;
      letter-spacing: 0.06em;
    }

    /* ── 〇×ボタン */
    .tf-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .tf-btn {
      padding: 1.2rem;
      font-size: 2.8rem;
      line-height: 1;
      border: 1px solid;
      border-radius: 14px;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .tf-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .tf-btn:active:not(:disabled) { transform: translateY(0); }
    .tf-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .tf-true  { border-color: rgba(74,222,128,0.45);  color: #4ade80; }
    .tf-false { border-color: rgba(248,113,113,0.45); color: #f87171; }

    .tf-true:hover:not(:disabled)  { background: rgba(74,222,128,0.1); }
    .tf-false:hover:not(:disabled) { background: rgba(248,113,113,0.1); }

    /* ── 解説 */
    .explanation {
      background: rgba(245,166,35,0.07);
      border: 1px solid rgba(245,166,35,0.18);
      border-radius: 11px;
      padding: 0.9rem 1.1rem;
      font-size: 0.84rem;
      line-height: 1.8;
      color: #b8ccd8;
      display: none;
      margin-bottom: 1rem;
    }

    .explanation.show { display: block; }

    .explanation .ex-label {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: #f5a623;
      display: block;
      margin-bottom: 0.4rem;
    }

    /* ── 次へボタン */
    .btn-next {
      width: 100%;
      padding: 0.9rem;
      border: 1px solid rgba(233,69,96,0.5);
      background: transparent;
      color: #e94560;
      font-family: inherit;
      font-size: 0.88rem;
      letter-spacing: 0.3em;
      cursor: pointer;
      border-radius: 11px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      display: none;
    }

    .btn-next.show { display: block; }

    .btn-next:hover {
      background: rgba(233,69,96,0.13);
      border-color: #e94560;
      color: #ff7090;
    }

    /* カウンター */
    .counter {
      text-align: center;
      margin-top: 1.2rem;
      line-height: 1;
    }

    .counter .c-label {
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      color: #8899aa;
      display: block;
      margin-bottom: 0.3rem;
    }

    .counter .c-num {
      font-size: 1rem;
      color: #f5a623;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    /* ── 結果画面 */
    .result-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 640px;
      padding: 2rem 0 3rem;
    }

    .result-screen.show { display: flex; }

    .result-card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
      width: 100%;
      animation: slideUp 0.5s ease;
    }

    .result-emoji { font-size: 3.5rem; margin-bottom: 0.8rem; }

    .result-title {
      font-size: 1.2rem;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      margin-bottom: 1rem;
      color: #ddeeff;
    }

    .result-pct {
      font-size: 5rem;
      font-weight: bold;
      line-height: 1;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #e94560, #f5a623);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .result-detail {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: #8899aa;
      margin-bottom: 1.8rem;
    }

    .result-score-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.6rem;
    }

    .result-score-card {
      flex: 1;
      max-width: 120px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 1rem 0.5rem;
    }

    .result-score-card .rs-label { font-size: 0.62rem; letter-spacing: 0.22em; color: #8899aa; margin-bottom: 0.4rem; display: block; }
    .result-score-card .rs-val   { font-size: 1.8rem; font-weight: bold; }
    .result-score-card.c .rs-val { color: #4ade80; }
    .result-score-card.w .rs-val { color: #f87171; }

    .result-divider {
      width: 40px;
      height: 1px;
      background: rgba(233,69,96,0.4);
      margin: 0 auto 1.4rem;
    }

    .result-msg {
      font-size: 0.88rem;
      line-height: 1.85;
      color: #aabbcc;
      letter-spacing: 0.04em;
      margin-bottom: 1.8rem;
    }

    .btn-retry {
      width: 100%;
      padding: 0.9rem;
      border: 1px solid rgba(233,69,96,0.5);
      background: transparent;
      color: #e94560;
      font-family: inherit;
      font-size: 0.88rem;
      letter-spacing: 0.3em;
      cursor: pointer;
      border-radius: 11px;
      transition: background 0.2s, color 0.2s;
    }

    .btn-retry:hover {
      background: rgba(233,69,96,0.13);
      color: #ff7090;
    }

    /* フッター */
    .footer-deco {
      padding: 1.5rem 0 2rem;
      font-size: 0.7rem;
      letter-spacing: 0.5em;
      color: rgba(233,69,96,0.25);
    }

    /* アニメーション */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-7px); }
      75%      { transform: translateX(7px); }
    }

    @keyframes pop {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }

    .anim-slide { animation: slideUp 0.4s ease; }
    .anim-shake { animation: shake  0.35s ease; }
    .anim-pop   { animation: pop    0.3s ease; }

    @media (max-width: 480px) {
      .header h1   { font-size: 1.5rem; }
      .tf-btn      { font-size: 2.2rem; padding: 1rem; }
      .question-card { padding: 1.4rem 1.2rem 1.2rem; }
      .result-pct  { font-size: 4rem; }
    }
  </style>
</head>
<body>

<div class="top-line"></div>

<div class="container" id="gameArea">

  <div class="header">
    <h1>雑 学 ク イ ズ</h1>
    <p>本当か嘘か、知識で見破れ</p>
  </div>

  <div class="progress-section">
    <div class="progress-info">
      <span id="progressText">問題 1 / 20</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="score-display">
    <div class="score-card accuracy">
      <span class="label">正 解 率</span>
      <span class="value" id="accuracyVal">－</span>
    </div>
    <div class="score-card correct">
      <span class="label">正 解</span>
      <span class="value" id="correctVal">0</span>
    </div>
    <div class="score-card wrong">
      <span class="label">不 正 解</span>
      <span class="value" id="wrongVal">0</span>
    </div>
  </div>

  <div class="question-card anim-slide" id="questionCard">
    <div class="badge-row">
      <span class="badge badge-num" id="badgeNum">第 1 問</span>
      <span class="badge badge-cat" id="badgeCat">生き物</span>
    </div>

    <div class="quote-box">
      <p class="question-text" id="questionText">読み込み中…</p>
    </div>

    <div class="tf-btns">
      <button class="tf-btn tf-true"  id="btnTrue"  onclick="selectAnswer(true)">〇</button>
      <button class="tf-btn tf-false" id="btnFalse" onclick="selectAnswer(false)">×</button>
    </div>

    <div class="explanation" id="explanation">
      <span class="ex-label">解 説</span>
      <span id="explanationText"></span>
    </div>

    <button class="btn-next" id="btnNext" onclick="nextQuestion()">▷ &nbsp; 次の問題へ</button>

    <div class="counter">
      <span class="c-label">汝 の 正 解</span>
      <span class="c-num" id="myScore">0</span>
    </div>

    <div class="feedback-overlay" id="feedbackOverlay">
      <div class="feedback-icon"  id="fbIcon"></div>
      <div class="feedback-text"  id="fbText"></div>
      <div class="feedback-truth" id="fbTruth"></div>
    </div>
  </div>

</div>

<div class="result-screen" id="resultScreen">
  <div class="result-card">
    <div class="result-emoji"   id="resultEmoji"></div>
    <div class="result-title">ク イ ズ 終 了</div>
    <div class="result-pct"    id="resultPct"></div>
    <div class="result-detail"  id="resultDetail"></div>
    <div class="result-score-row">
      <div class="result-score-card c">
        <span class="rs-label">正 解</span>
        <span class="rs-val" id="rCorrect"></span>
      </div>
      <div class="result-score-card w">
        <span class="rs-label">不 正 解</span>
        <span class="rs-val" id="rWrong"></span>
      </div>
    </div>
    <div class="result-divider"></div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="btn-retry" onclick="restart()">▷ &nbsp; もう一度挑戦</button>
  </div>
</div>

<p class="footer-deco">✦ &nbsp; ✦ &nbsp; ✦</p>

<script>
// isTrue: true = 本当の雑学、false = 嘘の雑学
const quizData = [
  // ── 本当の雑学 ──────────────────────────────────
  {
    q: "タコには心臓が3つある。",
    isTrue: true, cat: "生き物",
    ex: "えら心臓が2つ＋体心臓が1つで合計3つです。えら心臓が血液をえらへ送り、体心臓が全身に循環させます。"
  },
  {
    q: "富士山の標高は3,776mである。",
    isTrue: true, cat: "日本",
    ex: "日本最高峰で標高3,776m。最後の噴火は1707年の宝永大噴火で、そのとき山腹に宝永火口が形成されました。"
  },
  {
    q: "成人の人間の骨の数は約206本である。",
    isTrue: true, cat: "人体",
    ex: "赤ちゃんは約300本以上ありますが、成長とともに骨が融合して成人では約206本になります。"
  },
  {
    q: "人間の脳は体重の約2%しかないが、全身エネルギーの約20%を消費する。",
    isTrue: true, cat: "人体",
    ex: "脳はサイズのわりに非常にエネルギー消費が大きい器官です。常に膨大な情報処理を行っているためです。"
  },
  {
    q: "蜂蜜は適切に密封保存すれば何千年経っても腐らない。",
    isTrue: true, cat: "食べ物",
    ex: "エジプトの王墓から約3300年前の蜂蜜が食べられる状態で発見されています。高糖度・低水分で細菌が繁殖できないためです。"
  },
  {
    q: "サメが地球上に登場したのは、恐竜より3億年以上前のことだ。",
    isTrue: true, cat: "生き物",
    ex: "サメは約4億5000万年前（オルドビス紀）に出現。恐竜の出現は約2億3000万年前なので、サメはそれより約2億2000万年古い生き物です。"
  },
  {
    q: "アリは自分の体重の約50倍の重さを運ぶことができる。",
    isTrue: true, cat: "生き物",
    ex: "体が小さいほど体積に対する筋肉断面積の割合が大きくなるため、相対的に大きな力を発揮できます。種類によっては50倍以上の記録もあります。"
  },
  {
    q: "日本の国鳥はキジである。",
    isTrue: true, cat: "日本",
    ex: "1947年に日本鳥学会が選定しました。桃太郎にも登場するなど日本人に古くから親しまれており、１万円札の裏にも描かれています。"
  },
  {
    q: "人体の血管をすべてつなげると、地球を2周以上できる長さになる。",
    isTrue: true, cat: "人体",
    ex: "毛細血管を含む総延長は約10万km。地球一周が約4万kmなので、約2.5周分の長さになります。"
  },
  {
    q: "眠っている犬が夢を見ることは科学的に確認されている。",
    isTrue: true, cat: "生き物",
    ex: "MITの研究で、犬はREM睡眠中に日中の出来事を夢として再体験していることが確認されています。寝ている犬の足が動くのはそのためです。"
  },
  // ── 嘘の雑学 ──────────────────────────────────
  {
    q: "金魚の記憶はわずか3秒しか持続しない。",
    isTrue: false, cat: "生き物",
    ex: "都市伝説です。金魚の記憶は数ヶ月間持続することが研究で証明されています。餌のある場所を記憶し、条件反射的な学習もできます。"
  },
  {
    q: "万里の長城は宇宙から肉眼で見える。",
    isTrue: false, cat: "歴史",
    ex: "幅5〜8mほどの長城は細すぎて宇宙からは見えません。中国の宇宙飛行士・楊利偉氏も「見えなかった」と証言しています。"
  },
  {
    q: "ナポレオンの身長は当時のフランス人男性平均より20cm以上低かった。",
    isTrue: false, cat: "歴史",
    ex: "ナポレオンは約169cmで、当時の平均（約165cm）より高かったです。「低い」という印象はイギリスのプロパガンダと単位換算ミスが原因とされています。"
  },
  {
    q: "コウモリは目が見えないため、エコーロケーションだけを頼りに行動する。",
    isTrue: false, cat: "生き物",
    ex: "コウモリは目が見えないわけではありません。多くの種は視覚も持っており、エコーロケーションは暗闇での補助的なナビゲーション手段です。"
  },
  {
    q: "チョコレートは犬には有毒だが、猫には無害である。",
    isTrue: false, cat: "生き物",
    ex: "チョコレートのテオブロミンは猫にも有毒です。ただし猫は甘味を感じる受容体がないため自発的に食べたがらず、中毒例が犬より少ないだけです。"
  },
  {
    q: "ペンギンは南極と北極の両方に生息している。",
    isTrue: false, cat: "生き物",

  },
  {
    q: "カメレオンが体色を変えるのは、主に天敵から身を守るカモフラージュのためだ。",

    ex: "カメレオンの体色変化の主な目的はコミュニケーションと体温調節です。皮膚内のナノ結晶が光の反射を変えることで色が変わります。"
  },
  {
    q: "人間は死後も髪の毛と爪が伸び続ける。",
    isTrue: false, cat: "人体",
    ex: "死後は細胞分裂が止まるため伸びません。死後に皮膚が乾燥・収縮することで爪や髪が相対的に長く見えるだけです。"
  },
  {
    q: "光が地球を一周するのにかかる時間は約1秒である。",
    isTrue: false, cat: "科学",
    ex: "光の速さは約30万km/秒、地球一周は約4万kmなので、1周は約0.13秒（133ミリ秒）です。1秒間で地球を約7.5周できます。"
  },
  {
    q: "ガラスは非常にゆっくりと流れ続ける液体であり、古い窓ガラスの下が厚いのはそのためだ。",
    isTrue: false, cat: "科学",
    ex: "ガラスは常温で完全な固体です。古い窓ガラスの下が厚いのは、当時の製造技術の限界で厚い側を安定のため下にして設置したからです。"
  },
];

let shuffled = [], currentIdx = 0, score = 0, wrong = 0, answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  shuffled = shuffle(quizData);
  currentIdx = 0; score = 0; wrong = 0; answered = false;
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('resultScreen').classList.remove('show');
  updateStats();
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = shuffled[currentIdx];

  document.getElementById('badgeNum').textContent     = `第 ${currentIdx + 1} 問`;
  document.getElementById('badgeCat').textContent     = q.cat;
  document.getElementById('questionText').textContent = q.q;

  document.getElementById('btnTrue').disabled  = false;
  document.getElementById('btnFalse').disabled = false;
  document.getElementById('explanation').classList.remove('show');
  document.getElementById('btnNext').classList.remove('show');
  const ov = document.getElementById('feedbackOverlay');
  ov.className = 'feedback-overlay';

  const pct = Math.round((currentIdx / shuffled.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `問題 ${currentIdx + 1} / ${shuffled.length}`;
  document.getElementById('progressPct').textContent  = pct + '%';

  const card = document.getElementById('questionCard');
  card.classList.remove('anim-slide', 'anim-shake', 'anim-pop');
  void card.offsetWidth;
  card.classList.add('anim-slide');
}

function selectAnswer(userSaysTrue) {
  if (answered) return;
  answered = true;

  const q = shuffled[currentIdx];
  const correct = userSaysTrue === q.isTrue;

  if (correct) score++; else wrong++;
  updateStats();

  document.getElementById('btnTrue').disabled  = true;
  document.getElementById('btnFalse').disabled = true;

  // フィードバックオーバーレイ
  const ov = document.getElementById('feedbackOverlay');
  document.getElementById('fbIcon').textContent  = correct ? '⭕' : '❌';
  document.getElementById('fbText').textContent  = correct ? '正解！' : '不正解…';
  document.getElementById('fbTruth').textContent = q.isTrue ? '本当の雑学でした' : '嘘の雑学でした';
  ov.classList.add(correct ? 'correct' : 'wrong', 'show');

  // カードアニメーション
  const card = document.getElementById('questionCard');
  card.classList.remove('anim-slide', 'anim-shake', 'anim-pop');
  void card.offsetWidth;
  card.classList.add(correct ? 'anim-pop' : 'anim-shake');
  card.addEventListener('animationend', () => {
    card.classList.remove('anim-shake', 'anim-pop');
  }, { once: true });

  // 解説
  document.getElementById('explanationText').textContent = q.ex;
  document.getElementById('explanation').classList.add('show');

  // 次へボタン
  const btn = document.getElementById('btnNext');
  btn.textContent = currentIdx < shuffled.length - 1
    ? '▷ 　次の問題へ'
    : '▷ 　結果を見る';
  btn.classList.add('show');
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= shuffled.length) showResult();
  else loadQuestion();
}

function updateStats() {
  const total = score + wrong;
  const acc   = total > 0 ? Math.round((score / total) * 100) : null;
  document.getElementById('accuracyVal').textContent = acc !== null ? acc + '%' : '－';
  document.getElementById('correctVal').textContent  = score;
  document.getElementById('wrongVal').textContent    = wrong;
  document.getElementById('myScore').textContent     = score;
}

function showResult() {
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('resultScreen').classList.add('show');

  const total = shuffled.length;
  const pct   = Math.round((score / total) * 100);

  document.getElementById('resultPct').textContent    = pct + '%';
  document.getElementById('resultDetail').textContent = `${total}問中 ${score}問正解`;
  document.getElementById('rCorrect').textContent     = score;
  document.getElementById('rWrong').textContent       = wrong;

  let emoji, msg;
  if      (pct >= 90) { emoji = '🏆'; msg = '素晴らしい！雑学マスターですね。ほぼすべての雑学を見破りました。'; }
  else if (pct >= 70) { emoji = '🎉'; msg = 'よくできました！雑学センスがありますね。あと少しで完璧です。'; }
  else if (pct >= 50) { emoji = '😊'; msg = 'まずまずの結果！半分以上正解できました。さらに上を目指して。'; }
  else if (pct >= 30) { emoji = '🤔'; msg = '雑学の奥深さを実感しましたか？もう一度チャレンジしてみましょう！'; }
  else                { emoji = '😅'; msg = '雑学は奥が深いですね…！繰り返すうちにきっと上達します！'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultMsg').textContent   = msg;
}

function restart() { init(); }

init();
</script>
</body>
</html>
